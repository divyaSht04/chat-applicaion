name: CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  HUSKY: 0   # disable git hooks in CI

jobs:
  api:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chat_test
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 5
        ports:
          - 5432:5432

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      TEST_DB_NAME: chat_test
      JWT_SECRET: ci-test-secret

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd api && npm ci
      - run: cd api && npx eslint "{src,apps,libs,test}/**/*.ts"   # detect only, no --fix
      - run: cd api && npm run test
      - run: cd api && npm run test:e2e

  client:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd client && npm ci
      - run: cd client && npm run lint
      - run: cd client && npx vitest run   # explicit run mode, not watch

  docker-push:
    needs: [api, client]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: api/Dockerfile
          push: true
          tags: icely77/chat-application-be:latest

      - uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: client/Dockerfile
          push: true
          tags: icely77/chat-application-fe:latest
